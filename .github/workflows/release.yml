name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # 執行檔一律叫 cbeta-ebook-renamer，平台資訊放在壓縮檔名上，
          # 這樣 README 裡的指令對每個平台都是照抄就能用。
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -trimpath -ldflags="-s -w" -o "cbeta-ebook-renamer${EXT}" .
          if [ "$GOOS" = "windows" ]; then
            zip "cbeta-ebook-renamer-${GOOS}-${GOARCH}.zip" "cbeta-ebook-renamer${EXT}" README.md
          else
            tar czf "cbeta-ebook-renamer-${GOOS}-${GOARCH}.tar.gz" "cbeta-ebook-renamer${EXT}" README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cbeta-ebook-renamer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
